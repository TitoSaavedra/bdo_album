name: Release

on:
  push:
    branches:
      - releases

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create_release.outputs.release_id }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # scraper and album ship in the same combined release — bump both
      # tauri.conf.json "version" fields together before pushing to `releases`.
      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(jq -r .version scraper/src-tauri/tauri.conf.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create draft release
        id: create_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          RELEASE_JSON=$(gh api repos/${{ github.repository }}/releases \
            -f tag_name="${{ steps.version.outputs.tag }}" \
            -f name="BDO Suite ${{ steps.version.outputs.tag }}" \
            -F draft=true \
            -F prerelease=false)
          echo "release_id=$(echo "$RELEASE_JSON" | jq -r .id)" >> "$GITHUB_OUTPUT"

  # album's sqlx::query!/query_as! macros verify SQL against a real database at
  # compile time. CI has no persistent Postgres, so we spin one up here, apply
  # scraper's migrations (the schema both apps share), and cache the query
  # metadata offline for build-album to consume — no local DB needed to release.
  prepare-sqlx:
    needs: prepare
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bdo
          POSTGRES_PASSWORD: bdo
          POSTGRES_DB: bdo_album
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # album pulls in Tauri, which on Linux needs GTK/WebKitGTK dev headers
      # (glib-sys, gobject-sys, ...) to even `cargo check` — bare ubuntu-latest
      # doesn't have them.
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache sqlx-cli binary
        id: sqlx-cli-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/
          key: sqlx-cli-${{ runner.os }}-v0.8.6

      - name: Install sqlx-cli
        if: steps.sqlx-cli-cache.outputs.cache-hit != 'true'
        run: cargo install sqlx-cli --version 0.8.6 --no-default-features --features postgres,rustls --locked

      - name: Run scraper migrations
        working-directory: scraper/src-tauri
        env:
          DATABASE_URL: postgres://bdo:bdo@localhost:5432/bdo_album
        run: sqlx migrate run

      - name: Generate album sqlx offline cache
        working-directory: album/src-tauri
        env:
          DATABASE_URL: postgres://bdo:bdo@localhost:5432/bdo_album
        run: cargo sqlx prepare

      - name: Upload sqlx cache
        uses: actions/upload-artifact@v4
        with:
          name: album-sqlx-cache
          path: album/src-tauri/.sqlx

  build-scraper:
    needs: prepare
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache (scraper)
        uses: swatinem/rust-cache@v2
        with:
          workspaces: scraper/src-tauri

      - name: Install scraper deps
        working-directory: scraper
        run: pnpm install

      - name: Build & release scraper
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: scraper
          releaseId: ${{ needs.prepare.outputs.release_id }}
          releaseDraft: true
          prerelease: false

      # tauri-action always names the updater manifest "latest.json" — rename it
      # right away so album's build (same release) doesn't collide with it.
      - name: Rename scraper updater manifest
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ASSET_ID=$(gh api repos/${{ github.repository }}/releases/${{ needs.prepare.outputs.release_id }}/assets --jq '.[] | select(.name=="latest.json") | .id')
          gh api -X PATCH repos/${{ github.repository }}/releases/assets/$ASSET_ID -f name=scraper-latest.json

  build-album:
    needs: [prepare, prepare-sqlx]
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache (album)
        uses: swatinem/rust-cache@v2
        with:
          workspaces: album/src-tauri

      - name: Install album deps
        working-directory: album
        run: pnpm install

      - name: Download sqlx offline cache
        uses: actions/download-artifact@v4
        with:
          name: album-sqlx-cache
          path: album/src-tauri/.sqlx

      - name: Build & release album
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          SQLX_OFFLINE: "true"
        with:
          projectPath: album
          releaseId: ${{ needs.prepare.outputs.release_id }}
          releaseDraft: true
          prerelease: false

      - name: Rename album updater manifest
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ASSET_ID=$(gh api repos/${{ github.repository }}/releases/${{ needs.prepare.outputs.release_id }}/assets --jq '.[] | select(.name=="latest.json") | .id')
          gh api -X PATCH repos/${{ github.repository }}/releases/assets/$ASSET_ID -f name=album-latest.json

  publish:
    needs: [prepare, build-scraper, build-album]
    runs-on: ubuntu-latest

    steps:
      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X PATCH repos/${{ github.repository }}/releases/${{ needs.prepare.outputs.release_id }} -F draft=false
