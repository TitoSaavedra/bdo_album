name: Release

on:
  push:
    branches:
      - releases

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache (scraper)
        uses: swatinem/rust-cache@v2
        with:
          workspaces: scraper/src-tauri

      - name: Rust cache (album)
        uses: swatinem/rust-cache@v2
        with:
          workspaces: album/src-tauri

      - name: Install scraper deps
        working-directory: scraper
        run: pnpm install

      - name: Install album deps
        working-directory: album
        run: pnpm install

      # scraper and album ship in the same combined release — bump both
      # tauri.conf.json "version" fields together before pushing to `releases`.
      - name: Build & release scraper
        id: rel_scraper
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: scraper
          tagName: v__VERSION__
          releaseName: "BDO Suite v__VERSION__"
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true

      # tauri-action always names the updater manifest "latest.json" — rename it
      # right away so album's build (same release) doesn't collide with it.
      - name: Rename scraper updater manifest
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ASSET_ID=$(gh api repos/${{ github.repository }}/releases/${{ steps.rel_scraper.outputs.releaseId }}/assets --jq '.[] | select(.name=="latest.json") | .id')
          gh api -X PATCH repos/${{ github.repository }}/releases/assets/$ASSET_ID -f name=scraper-latest.json

      - name: Build & release album
        id: rel_album
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: album
          releaseId: ${{ steps.rel_scraper.outputs.releaseId }}
          updaterJsonPreferNsis: true

      - name: Rename album updater manifest
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ASSET_ID=$(gh api repos/${{ github.repository }}/releases/${{ steps.rel_scraper.outputs.releaseId }}/assets --jq '.[] | select(.name=="latest.json") | .id')
          gh api -X PATCH repos/${{ github.repository }}/releases/assets/$ASSET_ID -f name=album-latest.json
