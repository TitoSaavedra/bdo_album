<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c10"/>
      <stop offset="100%" stop-color="#130a06"/>
    </linearGradient>
    <linearGradient id="gem-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe566"/>
      <stop offset="100%" stop-color="#ffcc4d"/>
    </linearGradient>
    <linearGradient id="gem-left" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b3861b"/>
      <stop offset="100%" stop-color="#ffcc4d"/>
    </linearGradient>
    <linearGradient id="gem-right" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffdd6b"/>
      <stop offset="100%" stop-color="#996600"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft-glow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Subtle border ring -->
  <rect x="3" y="3" width="506" height="506" rx="94" fill="none"
        stroke="#ffcc4d" stroke-width="1.5" opacity="0.18"/>

  <!-- Gem glow aura -->
  <ellipse cx="256" cy="270" rx="110" ry="140" fill="#ffcc4d" opacity="0.06" filter="url(#glow)"/>

  <!-- ── Diamond gem (classic brilliant cut) ── -->
  <!-- Crown: top 5 facets -->
  <polygon points="256,78 340,198 300,198 256,168 212,198 172,198"
           fill="url(#gem-top)" opacity="0.95" filter="url(#soft-glow)"/>

  <!-- Table (center crown facet) -->
  <polygon points="256,168 300,198 256,198 212,198"
           fill="#ffe566" opacity="0.6"/>

  <!-- Girdle left pavilion -->
  <polygon points="172,198 212,198 192,298 152,418"
           fill="url(#gem-left)" opacity="0.82"/>

  <!-- Girdle right pavilion -->
  <polygon points="340,198 360,418 320,298 300,198"
           fill="url(#gem-right)" opacity="0.78"/>

  <!-- Center pavilion -->
  <polygon points="212,198 300,198 280,318 256,434 232,318"
           fill="#ffcc4d" opacity="0.65"/>

  <!-- Bottom left -->
  <polygon points="152,418 192,298 232,318 256,434"
           fill="#b3861b" opacity="0.85"/>

  <!-- Bottom right -->
  <polygon points="360,418 256,434 280,318 320,298"
           fill="#cc9922" opacity="0.80"/>

  <!-- Crown highlight (light reflection) -->
  <polygon points="256,78 282,155 256,145 230,155"
           fill="white" opacity="0.22"/>

  <!-- Left crown facet highlight -->
  <polygon points="172,198 212,198 200,165"
           fill="white" opacity="0.10"/>

  <!-- Sparkle dots -->
  <circle cx="148" cy="142" r="5" fill="#ffcc4d" opacity="0.55"/>
  <circle cx="364" cy="128" r="3.5" fill="#ffcc4d" opacity="0.45"/>
  <circle cx="136" cy="380" r="3" fill="#ffcc4d" opacity="0.35"/>
  <circle cx="376" cy="390" r="4" fill="#ffcc4d" opacity="0.40"/>

  <!-- 4-point star at top-right -->
  <g transform="translate(370,108)" fill="#ffcc4d" opacity="0.5">
    <polygon points="0,-10 2,-2 10,0 2,2 0,10 -2,2 -10,0 -2,-2"/>
  </g>
  <!-- Small 4-point star bottom-left -->
  <g transform="translate(142,370)" fill="#ffcc4d" opacity="0.35">
    <polygon points="0,-7 1.5,-1.5 7,0 1.5,1.5 0,7 -1.5,1.5 -7,0 -1.5,-1.5"/>
  </g>
</svg>
