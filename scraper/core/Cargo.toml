[package]
name = "bdo-scraper-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "bdo_scraper_core"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "native-tls"] }
playwright-rs = "0.15"
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono"] }
dotenvy = "0.15"
thiserror = "1"
aws-sdk-s3 = "1"
aws-config = "1"
zip    = "2"
base64 = "0.22"
dirs   = "6"
