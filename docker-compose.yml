services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: bdo_album
      POSTGRES_USER: bdo
      POSTGRES_PASSWORD: bdo
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bdo -d bdo_album"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
